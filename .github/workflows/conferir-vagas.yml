# TEMPORÁRIO (2026-11-18): confere os freios das vagas novas da Oracle. Sai antes do PR.
name: Conferir vagas da Oracle
on:
  push:
    branches: [claude/project-thread-tf785f]
    paths: ['.github/workflows/conferir-vagas.yml']
permissions:
  contents: read
jobs:
  vaga:
    strategy:
      matrix:
        etiqueta: [aethra-testes, aethra-robo]
    runs-on: ${{ matrix.etiqueta }}
    timeout-minutes: 5
    steps:
      - run: |
          for s in /etc/systemd/system/actions.runner.*.service; do n=$(basename $s); echo "$n: $(systemctl show -p CPUWeight -p MemoryMax -p Nice -p ActiveState $n | tr '\n' ' ')"; done
          ls /etc/systemd/system/actions.runner.*.service.d/ 2>&1
          command -v xvfb-run jq; ls /usr/share/vulkan/icd.d/ ; cat /proc/self/cgroup; free -m; uptime
