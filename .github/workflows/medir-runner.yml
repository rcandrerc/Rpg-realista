# TEMPORÁRIO (thread de acelerar builds): mede o site (pages.yml sem publicar) no runner. Sai antes do PR.
name: Medir runner
on:
  push:
    branches: [claude/project-thread-tf785f]
    paths: ['.github/workflows/medir-runner.yml']
jobs:
  site:
    runs-on: aethra-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash ferramentas/servidor/empacotar.sh
      - name: Atualização
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p client/dist/atualizacao
          gh release download atualizacao -D client/dist/atualizacao --clobber || true
          gh release download conteudo -D client/dist/atualizacao --clobber || true
          du -sh client/dist client/dist/* | sort -h | tail
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
          name: medir-site
      - name: Memória no fim
        run: free -m; uptime
