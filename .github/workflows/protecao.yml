# Proteção contra recurso apagado sem querer (regra do André: atualização não sobrepõe a anterior, a não ser que ele peça).
# 1) O ramo do PR precisa ter a main mais nova dentro (junta a main ou rebase antes do merge).
# 2) Trava geral: nada que já existe na main pode sumir ou ser trocado (arquivo, asset, função, nó de cena, chave de dados...),
#    a não ser com a etiqueta "remoção aprovada", que só se coloca quando o André pediu.
# 3) Lista ferramentas/protecao/recursos.json: comportamentos importantes que precisam continuar no código.
name: Nada some

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: O ramo tem a main mais nova
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if ! git merge-base --is-ancestor "origin/${{ github.base_ref }}" HEAD; then
            echo "::error::Este ramo não tem a ${{ github.base_ref }} mais nova. Junte a main (ou faça rebase), resolva os conflitos mantendo os dois lados e rode de novo."
            exit 1
          fi
          echo "Ramo em dia com a ${{ github.base_ref }}."
      - name: Nada que já existia foi apagado ou trocado
        if: github.event_name == 'pull_request'
        env:
          APROVADO: ${{ contains(github.event.pull_request.labels.*.name, 'remoção aprovada') && '1' || '0' }}
        run: node ferramentas/protecao/nada-some.mjs "origin/${{ github.base_ref }}" HEAD
      - name: Recursos da lista continuam no código
        run: node ferramentas/protecao/conferir.mjs --main
