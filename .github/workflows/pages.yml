# Publica o jogo no GitHub Pages a cada push na main (e o pacote do servidor em /servidor, que a Oracle baixa sozinha).
# Sem servidor o jogo roda no modo solo; para multiplayer, abra com ?servidor=wss://endereco-do-servidor
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    # mudança só no app Godot: o apk.yml gera o pacote e chama este workflow sozinho no fim; texto não muda o site
    paths-ignore: ['godot-prototipo/**', '**/*.md']
  workflow_dispatch:
    inputs:
      abrir_servidor:
        description: 'Publicar o servidor aberto uma vez (só para máquina nova da Oracle, que ainda não tem chave)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Fila em vez de cancelar: o push e o apk.yml chamam este workflow para o mesmo commit quase juntos, e cancelar
# um deles no meio do deploy cancelava também o deploy do outro (mesmo ID = commit) e o pacote novo não chegava
# ao site (2026-11-04, execução 208). Com fila, um termina e o mais novo roda depois; o do meio é descartado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    # Com a variável RUNNER_BUILD definida e o repositório PRIVADO, roda no runner próprio da Oracle (não gasta cota
    # do GitHub). Repositório público ou sem a variável: roda no GitHub (ubuntu-latest). Ver ferramentas/runner/LEIAME.md.
    runs-on: ${{ github.event.repository.private && vars.RUNNER_BUILD || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash ferramentas/servidor/empacotar.sh # o servidor sai junto; a máquina da Oracle se atualiza a partir daqui
        env:
          ABRIR_SERVIDOR: ${{ inputs.abrir_servidor && '1' || '0' }}
      - name: Atualização do app Godot em /atualizacao (gerada pelo apk.yml no release "atualizacao")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p client/dist/atualizacao
          gh release download atualizacao -D client/dist/atualizacao --clobber || echo "Ainda sem release atualizacao"
          gh release download conteudo -D client/dist/atualizacao --clobber || echo "Ainda sem release conteudo (APK casca)"
          ls -la client/dist/atualizacao
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deploy
        uses: actions/deploy-pages@v4
        # O GitHub identifica cada publicação pelo commit: a segunda publicação do MESMO commit (a que o apk.yml chama
        # depois de subir o pacote novo) dava "sucesso" mas o site continuava com a primeira, que ainda tinha o
        # conteudo.json da versão anterior. Resultado: o celular ficava sempre uma versão atrás (2026-11-09: 1731 não
        # chegava). Com o número da execução junto, cada publicação vale.
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
