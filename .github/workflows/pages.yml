# Publica o jogo no GitHub Pages a cada push na main (e o pacote do servidor em /servidor, que a Oracle baixa sozinha).
# Sem servidor o jogo roda no modo solo; para multiplayer, abra com ?servidor=wss://endereco-do-servidor
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    # mudança só no app Godot: o apk.yml gera o pacote e chama este workflow sozinho no fim; texto não muda o site
    paths-ignore: ['godot-prototipo/**', '**/*.md']
  workflow_dispatch:
    inputs:
      abrir_servidor:
        description: 'Publicar o servidor aberto uma vez (só para máquina nova da Oracle, que ainda não tem chave)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    # Com a variável RUNNER_BUILD definida, roda no runner próprio da Oracle (não gasta cota do GitHub).
    # Sem ela, roda no GitHub (ubuntu-latest), como sempre. Ver ferramentas/runner/LEIAME.md.
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash ferramentas/servidor/empacotar.sh # o servidor sai junto; a máquina da Oracle se atualiza a partir daqui
        env:
          ABRIR_SERVIDOR: ${{ inputs.abrir_servidor && '1' || '0' }}
      - name: Atualização do app Godot em /atualizacao (gerada pelo apk.yml no release "atualizacao")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p client/dist/atualizacao
          gh release download atualizacao -D client/dist/atualizacao --clobber || echo "Ainda sem release atualizacao"
          gh release download conteudo -D client/dist/atualizacao --clobber || echo "Ainda sem release conteudo (APK casca)"
          ls -la client/dist/atualizacao
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deploy
        uses: actions/deploy-pages@v4
