# Gera a versão PC do jogo (Windows .exe). Só roda à mão: Actions > "Versão PC (Windows)" > Run workflow.
# Não mexe em nada do celular: não roda no push, não toca no APK nem nas atualizações dentro do app, e as mudanças de
# PC (texturas de PC, teclado/mouse, preset Windows) só são aplicadas na cópia desta execução (ferramentas/pc/preparar.sh).
# Usa a mesma máquina do APK (runner da Oracle quando o repositório é privado; senão a do GitHub, de graça em público).
# Na main: publica no release "pc" (link fixo: releases/download/pc/Aethra-PC.zip). Outro ramo: Artifacts da execução.
# Detalhes: ferramentas/pc/LEIAME.md
name: Versão PC (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT: 4.7.1-stable

jobs:
  windows:
    runs-on: ${{ github.event.repository.private && vars.RUNNER_BUILD || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Os modelos (vila, personagens, monstros) são os mesmos do APK: pega os do último build do APK (cache).
      # Só lê o cache, nunca grava (o cache do APK continua igual).
      - name: Modelos do último build do APK (cache)
        uses: actions/cache/restore@v4
        with:
          path: godot-prototipo/modelos
          key: modelos-v2-pc-nunca-existe
          restore-keys: modelos-v2-
      - name: Confere os modelos
        run: |
          [ -f godot-prototipo/modelos/armas.json ] || { echo "::error::Sem os modelos no cache. Rode o APK na main uma vez (ele exporta os modelos) e tente de novo."; exit 1; }
          ls godot-prototipo/modelos | wc -l
      # Importação com as texturas de PC: cache separado do APK (outra chave), para não misturar com o do celular.
      - name: Importação do Godot para PC (cache)
        uses: actions/cache@v4
        with:
          path: |
            godot-prototipo/.godot
            godot-prototipo/**/*.import
          key: godot-import-pc-v1-${{ env.GODOT }}-${{ hashFiles('godot-prototipo/**', 'ferramentas/pc/**') }}
          restore-keys: godot-import-pc-v1-${{ env.GODOT }}-
      - name: Godot e modelo de exportação do Windows
        run: |
          # no runner da Oracle o Godot já vem instalado (GODOT_BIN no .env)
          if [ -n "${GODOT_BIN:-}" ] && [ -x "${GODOT_BIN:-/nao}" ] && [ -f ~/.local/share/godot/export_templates/4.7.1.stable/windows_release_x86_64.exe ]; then
            echo "Godot já instalado em $GODOT_BIN"; exit 0
          fi
          case "$(uname -m)" in aarch64|arm64) PLAT=linux.arm64;; *) PLAT=linux.x86_64;; esac
          cd /tmp
          if [ -z "${GODOT_BIN:-}" ] || [ ! -x "${GODOT_BIN:-/nao}" ]; then
            curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_${PLAT}.zip
            unzip -qo godot.zip
            echo "GODOT_BIN=/tmp/Godot_v${GODOT}_${PLAT}" >> $GITHUB_ENV
          fi
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_export_templates.tpz
          unzip -qo tpl.tpz 'templates/windows_release_x86_64.exe' 'templates/version.txt'
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cp templates/* ~/.local/share/godot/export_templates/4.7.1.stable/
          rm -f tpl.tpz
      - name: Preparar a cópia para PC (texturas de PC, teclado e mouse, preset Windows)
        run: bash ferramentas/pc/preparar.sh
      - name: Importar
        working-directory: godot-prototipo
        run: $GODOT_BIN --headless --import || true
      - name: Exportar o .exe
        working-directory: godot-prototipo
        run: |
          mkdir -p $GITHUB_WORKSPACE/Aethra
          $GODOT_BIN --headless --export-release Windows $GITHUB_WORKSPACE/Aethra/Aethra.exe
          ls -la $GITHUB_WORKSPACE/Aethra
          [ -s $GITHUB_WORKSPACE/Aethra/Aethra.pck ] || { echo "::error::Exportação sem o pacote do jogo"; exit 1; }
          cp $GITHUB_WORKSPACE/ferramentas/pc/LEIA-ME.txt $GITHUB_WORKSPACE/ferramentas/pc/Aethra-OpenGL.bat $GITHUB_WORKSPACE/Aethra/
          cd $GITHUB_WORKSPACE && zip -qr Aethra-PC.zip Aethra && ls -la Aethra-PC.zip
      - name: Publicar no release "pc"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pc > /dev/null 2>&1 || gh release create pc --target main --prerelease --title "Versão PC (Windows)" --notes "Gerada à mão em Actions > Versão PC (Windows)."
          gh release upload pc Aethra-PC.zip --clobber
          gh release edit pc --notes "Versão PC do jogo (Windows 64 bits). Baixe, extraia a pasta e abra o Aethra.exe. Último build: ${GITHUB_SHA::7} (execução ${{ github.run_number }})."
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: Aethra-PC
          path: Aethra-PC.zip
          retention-days: 7
