# Robô 2 (André 2026-11-14: "o robô 2 vai ser mais interessante pra detectar perda de performance, travamentos"): o app
# Godot de verdade (mesmo motor e modelos do APK), com as opções do Poco X7 (Alta, limite 60), joga sozinho num servidor
# local: vila, estrada e Clareira dos Puglins com luta. Duas rodadas: sem tela (mede o processador: scripts, física,
# animação, carregamento) e com Vulkan por software na metade da tela do X7 (1356x610; o desenho é bem mais lento que
# num celular). Compara com a rodada anterior (perda de desempenho) e com os celulares de verdade (/lentidao/resumo).
# Relatório: https://163-176-80-126.sslip.io/robo (cartão 📱). 4 vezes por dia, entre os turnos do robô 1. Grátis
# (repositório público). Rodar agora: Actions > Robô 2 (celular) > Run workflow.
name: Robô 2 (celular)

on:
  schedule:
    - cron: '37 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Minutos sem tela (o Vulkan joga a metade)'
        default: '30'
  pull_request:
    paths: ['ferramentas/robo/celular*', '.github/workflows/robo-celular.yml']

permissions:
  contents: read
  id-token: write # o crachá OIDC para mandar o relatório

concurrency:
  group: robo-celular
  cancel-in-progress: false

jobs:
  celular:
    if: ${{ !github.event.repository.private || vars.RUNNER_ROBO != '' }}
    # Repositório PRIVADO: só roda na vaga dos robôs da Oracle (variável RUNNER_ROBO). Sem a vaga, fica parado em vez
    # de gastar a cota do GitHub (jogaria ~700 min por dia) ou prender o runner dos builds por horas.
    # Público: máquina do GitHub, como antes. Ver ferramentas/runner/LEIAME.md.
    runs-on: ${{ github.event.repository.private && (vars.RUNNER_ROBO || 'aethra-robo') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      GODOT: 4.7.1-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quanto tempo
        run: |
          m="${{ github.event.inputs.minutos }}"; [ -z "$m" ] && m=30; [ "${{ github.event_name }}" = pull_request ] && m=4
          echo "SEM_TELA_S=$((m * 60))" >> $GITHUB_ENV; echo "VULKAN_S=$((m * 30))" >> $GITHUB_ENV; echo "INICIO_MS=$(date +%s%3N)" >> $GITHUB_ENV
      # os modelos e a importação que o apk.yml guarda (o mesmo jogo do APK)
      - uses: actions/cache/restore@v4
        with:
          path: godot-prototipo/modelos
          key: modelos-v2-nada
          restore-keys: modelos-v2-
      - uses: actions/cache/restore@v4
        with:
          path: |
            godot-prototipo/.godot
            godot-prototipo/**/*.import
          key: godot-import-v2-${{ env.GODOT }}-nada
          restore-keys: godot-import-v2-${{ env.GODOT }}-
      - name: Godot e Vulkan por software
        run: |
          # runner da Oracle não tem sudo: os pacotes já vêm instalados (ferramentas/runner/instalar-vagas.sh)
          { command -v xvfb-run > /dev/null && ls /usr/share/vulkan/icd.d/lvp_icd* > /dev/null 2>&1; } || sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          case "$(uname -m)" in aarch64|arm64) PLAT=linux.arm64;; *) PLAT=linux.x86_64;; esac; echo "PLAT=$PLAT" >> $GITHUB_ENV # ARM na Oracle
          cd /tmp && curl -fsSL --retry 4 --retry-all-errors -o godot.zip https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_${PLAT}.zip && unzip -qo godot.zip
          echo "GODOT_BIN=/tmp/Godot_v${GODOT}_${PLAT}" >> $GITHUB_ENV
      - name: Importar o projeto
        run: mkdir -p /tmp/cel && cd godot-prototipo && timeout 1500 $GODOT_BIN --headless --import > /tmp/import.log 2>&1 || tail -20 /tmp/import.log
      # o Godot sai com código 0 mesmo com erro de script (a tela cinza da 2293 passou verde aqui): confere todos antes
      - name: Todo script compila
        run: |
          timeout 300 $GODOT_BIN --headless --path godot-prototipo -s $GITHUB_WORKSPACE/ferramentas/testes/scripts_godot.gd > /tmp/cel/scripts.log 2>&1 \
            && echo "SCRIPTS_OK=1" >> $GITHUB_ENV || echo "SCRIPTS_OK=0" >> $GITHUB_ENV
          grep -E "^(SCRIPTS|QUEBRADO|ERRO)" /tmp/cel/scripts.log | head -40
      - name: Servidor local
        run: |
          mkdir -p /tmp/srv
          echo "SESSAO=$(node ferramentas/motor/sessao.mjs /tmp/srv 2>/dev/null | tail -n1)" >> $GITHUB_ENV
          (cd server && DADOS=/tmp/srv PORT=2567 nohup node index.js > /tmp/srv/log.txt 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:2567/saude > /dev/null && break; sleep 1; done
          for h in 127.0.0.1 '[::1]'; do curl -s -m 3 "http://$h:2567/saude" > /dev/null && echo "SRV=http://$h:2567" >> $GITHUB_ENV && break; done
      - name: Jogar sem tela (processador)
        run: |
          RPG_SERVIDOR="$SRV" RPG_SESSAO="$SESSAO" DURACAO=$SEM_TELA_S SAIDA=/tmp/cel/sem-tela.json timeout $((SEM_TELA_S + 600)) stdbuf -oL -eL \
            $GODOT_BIN --headless --path godot-prototipo -s $GITHUB_WORKSPACE/ferramentas/robo/celular.gd > /tmp/cel/sem-tela.log 2>&1 || true
          grep -E "^\[entrada\]" /tmp/cel/sem-tela.log | head -40; grep -E "^CELULAR" /tmp/cel/sem-tela.log | cut -c1-400 | tail -40
      - name: Jogar com Vulkan por software (metade da tela do X7)
        env:
          LP_NUM_THREADS: 3 # o desenho por software deixa um núcleo livre: com todos ocupados a máquina do GitHub perdeu contato (2026-11-16)
          # 2026-11-17 (ronda): ainda perdeu contato uma vez (rodada das 23:29). O jogo roda com prioridade baixa (nice) para
          # o programa do GitHub que conversa com a máquina sempre ter vez
        run: |
          # vigia (ronda 2026-11-17: desde a noite de 16/11 a máquina do GitHub cai uns 4 min depois de começar este passo,
          # 3 rodadas seguidas, também na main): anota memória e processador a cada 5 s e fecha o Godot se a memória
          # livre ficar perto do fim, para a máquina não cair e o registro chegar
          (set +e; while true; do
            m=$(free -m | awk 'NR==2{print $3" usada "$7" livre"}'); c=$(cut -d' ' -f1 /proc/loadavg); g=$(ps -C Godot_v${GODOT}_${PLAT} -o rss= 2>/dev/null | awk '{s+=$1} END{print int(s/1024)}')
            echo "$(date +%T) mem $m MB, carga $c, godot ${g:-0} MB" >> /tmp/cel/vigia.log
            livre=$(free -m | awk 'NR==2{print $7}'); if [ "$livre" -lt 1500 ]; then echo "VIGIA: memória livre $livre MB, fechando o Godot" >> /tmp/cel/vigia.log; pkill -9 -f Godot_v; fi
            sleep 5; done) &
          VIGIA=$!
          RPG_SERVIDOR="$SRV" RPG_SESSAO="$SESSAO" DURACAO=$VULKAN_S SAIDA=/tmp/cel/vulkan.json timeout $((VULKAN_S + 420)) stdbuf -oL -eL \
            nice -n 15 xvfb-run -a -s "-screen 0 1356x610x24" $GODOT_BIN --path godot-prototipo --rendering-driver vulkan --rendering-method mobile \
            --resolution 1356x610 --render-thread safe -s $GITHUB_WORKSPACE/ferramentas/robo/celular.gd > /tmp/cel/vulkan.log 2>&1 || true
          kill $VIGIA 2>/dev/null || true
          echo "--- vigia (memória e carga)"; awk 'NR%6==1' /tmp/cel/vigia.log | tail -30; grep VIGIA /tmp/cel/vigia.log || true
          grep -E "^CELULAR" /tmp/cel/vulkan.log | cut -c1-400 | tail -40
      - name: Relatório
        if: always()
        run: |
          cp /tmp/srv/lentidao*.jsonl /tmp/cel/ 2>/dev/null || true
          cp /tmp/srv/log.txt /tmp/cel/servidor.log 2>/dev/null || true # por que uma entrada caiu (o app só diz "não respondeu")
          LOGS=/tmp/cel/scripts.log,/tmp/cel/sem-tela.log,/tmp/cel/vulkan.log node ferramentas/robo/celular-relatorio.mjs /tmp/srv /tmp/cel/sem-tela.json /tmp/cel/vulkan.json
          cp celular-relatorio.json /tmp/cel/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robo-celular-${{ github.run_id }}
          path: /tmp/cel
          retention-days: 2 # plano v3: cota de artefatos com o repositório fechado; a ronda das 9h só olha as últimas 24 h
      - name: Falhar se algum script não compila
        if: always()
        run: |
          [ "$SCRIPTS_OK" != 0 ] && exit 0
          for p in $(grep "^QUEBRADO" /tmp/cel/scripts.log | cut -d' ' -f2); do echo "::error title=Script não compila::$p"; done
          exit 1
