# Gera o APK do app Godot. Push na main: publica no release "apk" (link fixo para baixar no celular).
# Pull request: só gera para testar (Artifacts da execução) quando o PR tem a etiqueta "gerar apk", ou à mão
# (Actions > APK do app Godot > Run workflow, escolhendo o ramo). Cada build gasta ~15-25 min da cota do GitHub Actions;
# antes ele rodava em todo push de todo PR e acabou com a cota de novembro em 3 dias.
# Detalhes e a chave de assinatura: ferramentas/apk/LEIAME.md
name: APK do app Godot

on:
  push:
    branches: [main]
    paths: ['godot-prototipo/**', 'client/**', 'shared/**', '.github/workflows/apk.yml']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['godot-prototipo/**', 'client/**', 'shared/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write # para chamar o pages.yml depois de gerar o pacote de atualização

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT: 4.5-stable

jobs:
  apk:
    # PR sem a etiqueta "gerar apk" não gera APK (job pulado não gasta minuto)
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'gerar apk') && (github.event.action != 'labeled' || github.event.label.name == 'gerar apk'))
    # TESTE do runner próprio: este ramo aponta direto para o runner da Oracle (etiqueta aethra-build).
    # Na main continua ${{ vars.RUNNER_BUILD || 'ubuntu-latest' }}. Ver ferramentas/runner/LEIAME.md.
    runs-on: [self-hosted, aethra-build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # o APK antigo (godot-prototipo/apk) não precisa ser baixado
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Os modelos (vila, personagens, monstros) só dependem de client/, shared/ e das dependências.
      # Se nada disso mudou desde o último build, reaproveita e pula Chromium + exportação (~15 min).
      - name: Modelos já exportados (cache)
        id: cache-modelos
        uses: actions/cache@v4
        with:
          path: godot-prototipo/modelos
          key: modelos-v2-${{ hashFiles('client/**', '!client/node_modules/**', 'shared/**', 'package-lock.json') }}
          # sem o cache exato, volta a pasta do último build: modelo que sair igual fica com a importação antiga
          # (mesmos bytes no pacote) e o delta do app não traz o jogo inteiro de novo
          restore-keys: modelos-v2-
      - name: Chromium para exportar os modelos
        if: steps.cache-modelos.outputs.cache-hit != 'true'
        run: |
          npm install --no-save playwright@1.48.2
          # no runner próprio o instalar-runner.sh já pôs as bibliotecas do sistema e o usuário do build não tem sudo
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then npx playwright install chromium; else npx playwright install --with-deps chromium; fi
      - name: Modelos (vila, personagens, monstros) para godot-prototipo/modelos
        if: steps.cache-modelos.outputs.cache-hit != 'true'
        run: |
          # a pasta do último build (cache) fica de lado; os modelos saem numa pasta limpa e só o que mudou de verdade
          # (byte a byte) entra por cima dela. Lista do que mudou: /tmp/modelos-mudaram.txt
          mkdir -p /tmp/modelos-velhos
          [ -d godot-prototipo/modelos ] && cp -a godot-prototipo/modelos/. /tmp/modelos-velhos/
          rm -rf godot-prototipo/modelos
          (cd client && npx vite --port 5173 > /tmp/vite.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:5173 > /dev/null && break; sleep 1; done
          node client/exportar-godot/gerar-modelos.mjs
          : > /tmp/modelos-mudaram.txt
          for f in godot-prototipo/modelos/*; do
            n=$(basename "$f")
            cmp -s "$f" "/tmp/modelos-velhos/$n" || { cp "$f" "/tmp/modelos-velhos/$n"; echo "$n" >> /tmp/modelos-mudaram.txt; }
          done
          rm -rf godot-prototipo/modelos && mv /tmp/modelos-velhos godot-prototipo/modelos
          echo "Modelos que mudaram: $(wc -l < /tmp/modelos-mudaram.txt)"; cat /tmp/modelos-mudaram.txt
      # Importação do Godot (~5 min): guarda .godot e os .import; o Godot só reimporta o que mudou (confere o md5 de cada arquivo).
      - name: Importação do Godot (cache)
        uses: actions/cache@v4
        with:
          path: |
            godot-prototipo/.godot
            godot-prototipo/**/*.import
          key: godot-import-v2-${{ env.GODOT }}-${{ hashFiles('godot-prototipo/**', 'client/**', '!client/node_modules/**', 'shared/**') }}
          restore-keys: godot-import-v2-${{ env.GODOT }}-
      # Modelos gerados de novo: o .glb pode sair igual (mesmo md5) e o Godot não reimporta, então não extrai as
      # texturas (modelos/*_0.png ...) e o jogo quebra ao abrir (aconteceu no pacote 1282). As texturas extraídas
      # antes voltam com a pasta do cache; o que mudou (ou veio sem pasta antiga) reimporta à força.
      - name: Modelos novos reimportam
        if: steps.cache-modelos.outputs.cache-hit != 'true'
        run: |
          while read -r n; do rm -f "godot-prototipo/modelos/$n.import"; done < /tmp/modelos-mudaram.txt
          # sem nenhuma textura extraída (primeiro build sem cache): reimporta todos, como antes
          ls godot-prototipo/modelos/*_0.png > /dev/null 2>&1 || rm -f godot-prototipo/modelos/*.import
      - name: Godot e modelos de exportação
        run: |
          # No runner próprio da Oracle o Godot já vem instalado (GODOT_BIN no .env): pula o download.
          if [ -n "${GODOT_BIN:-}" ] && [ -x "${GODOT_BIN:-/nao}" ]; then
            echo "Godot já instalado em $GODOT_BIN; pulando download."
            exit 0
          fi
          # Escolhe a versão do Godot conforme a máquina (PC comum x86_64 ou ARM da Oracle).
          case "$(uname -m)" in aarch64|arm64) PLAT=linux.arm64;; *) PLAT=linux.x86_64;; esac
          cd /tmp
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_${PLAT}.zip
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot/releases/download/$GODOT/Godot_v${GODOT}_export_templates.tpz
          unzip -q godot.zip && unzip -q tpl.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.5.stable
          mv templates/* ~/.local/share/godot/export_templates/4.5.stable/
          echo "GODOT_BIN=/tmp/Godot_v${GODOT}_${PLAT}" >> $GITHUB_ENV
      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.5.tres
      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/rpg.keystore
            SENHA="$KS_SENHA"
            ALIAS="${KS_ALIAS:-prototipo}"
            echo "TEM_CHAVE=1" >> $GITHUB_ENV
          else
            # sem os secrets: chave descartável só para conferir que o build funciona. Esse APK NÃO vai para o release:
            # com outra chave o login Google não abre e o celular não instala por cima.
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64 nos Secrets: APK de teste com chave descartável, sem login Google (ver ferramentas/apk/LEIAME.md)"
            SENHA=$(openssl rand -hex 16)
            ALIAS=rpg
            keytool -genkeypair -keystore /tmp/rpg.keystore -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SENHA" -keypass "$SENHA" -dname "CN=RPG Realista, C=BR" > /dev/null
          fi
          echo "::add-mask::$SENHA"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/rpg.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$ALIAS" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$SENHA" >> $GITHUB_ENV
      # Primeiro o pacote do jogo e a atualização dentro do app (é o que o André espera); os APKs vêm depois,
      # assim a atualização chega ~3 min antes. Mesmos passos e mesma ordem de antes dentro de cada parte.
      - name: Versão e importação do Godot
        working-directory: godot-prototipo
        run: |
          # a versão sobe a cada build: o Android aceita instalar por cima.
          # Começa em 1000 porque um APK antigo feito à mão saiu com versionCode 200 (0.3): abaixo disso o celular recusa.
          sed -i "s/^version\/code=.*/version\/code=$((1000 + ${{ github.run_number }}))/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.4.${{ github.run_number }}\"/" export_presets.cfg
          # versão base do APK: o app só aceita pacote de atualização feito para esta base (inicio.gd)
          printf '\n[aethra]\n\natualizacao/base="%s"\n' "$((1000 + ${{ github.run_number }}))" >> project.godot
          $GODOT_BIN --headless --import || true
      - name: Pacote do jogo desta versão (mesmo conteúdo do APK)
        working-directory: godot-prototipo
        run: |
          $GODOT_BIN --headless --export-pack Android $GITHUB_WORKSPACE/base-$((1000 + ${{ github.run_number }})).pck
          ls -la $GITHUB_WORKSPACE/base-*.pck
      - name: Atualização dentro do app (pacote só com o que mudou desde o APK base)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CODIGO: ${{ github.run_number }}
        run: bash ferramentas/atualizacao/publicar.sh "$((1000 + CODIGO))"
      - name: Conteúdo do APK casca (jogo completo em partes + mudanças)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CODIGO: ${{ github.run_number }}
          ORACLE_PAR: ${{ secrets.ORACLE_PAR }}
          ORACLE_URL: ${{ vars.ORACLE_URL }}
        run: bash ferramentas/atualizacao/publicar-conteudo.sh "$((1000 + CODIGO))"
      - name: Exportar o APK
        working-directory: godot-prototipo
        run: |
          $GODOT_BIN --headless --install-android-build-template --export-release Android $GITHUB_WORKSPACE/rpg-realista.apk
          ls -la $GITHUB_WORKSPACE/rpg-realista.apk
          # SHA-1 da assinatura (o login Google exige 08:B6:1B:...:0D:CC, a chave oficial)
          $(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner verify --print-certs $GITHUB_WORKSPACE/rpg-realista.apk | grep -i "SHA-1"
      - name: APK casca (sem o jogo dentro; baixa tudo ao abrir, ferramentas/atualizacao/LEIAME.md)
        working-directory: godot-prototipo
        run: |
          printf 'atualizacao/casca=true\n' >> project.godot # fica na seção [aethra] gravada acima
          $GODOT_BIN --headless --export-release "Android casca" $GITHUB_WORKSPACE/rpg-realista-casca.apk
          ls -la $GITHUB_WORKSPACE/rpg-realista-casca.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rpg-realista-apk
          path: rpg-realista.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: rpg-realista-casca-apk
          path: rpg-realista-casca.apk
          retention-days: 14
      - name: Publicar no release "apk"
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.TEM_CHAVE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk > /dev/null 2>&1 || gh release create apk --target main --prerelease --title "APK mais recente" --notes "Gerado sozinho a cada push na main."
          gh release upload apk rpg-realista.apk --clobber
          gh release edit apk --notes "APK do app Godot, gerado sozinho a cada push na main. Último build: ${GITHUB_SHA::7} (execução ${{ github.run_number }})."
