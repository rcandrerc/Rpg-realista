<head>

<style>
/* Painel do clã (André 2026-11-24): página leve, sem 3D, para dar ordens e ver o clã quando não dá para jogar.
   Tudo escuro para gastar pouca bateria; a página só conversa com o servidor a cada 30 s. */
:root{--ink:#efe7d6;--muted:#a99e88;--line:rgba(239,231,214,.14);--card:#1c1a15;--fundo:#100f0c;--gold:#d9a54a;--hp:#b8432f;--vg:#5f9a45;--chama:#e0663a;--geada:#6fb3e6;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0) + var(--abas) + 8px)}
header{position:sticky;top:0;z-index:2;background:rgba(16,15,12,.96);border-bottom:1px solid var(--line);padding:10px 16px 0}
.topo{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:1.1rem;margin:0;color:var(--gold);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:.82rem}
.estado{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);flex:none}
.estado i{width:9px;height:9px;border-radius:50%;background:#666;display:inline-block}
.estado.on i{background:#5fbf5a;box-shadow:0 0 6px #5fbf5a}
.estado.caiu i{background:#d0903a}
.wiki{color:var(--gold);text-decoration:none;font:600 .8rem system-ui,sans-serif;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
/* 5 abas fixas embaixo (André 2026-11-26): Jogo, Mochila, Clã, Missões, Mais; o polegar alcança com o celular em pé */
:root{--abas:58px}
header{padding:6px 16px}
body:not(.abaCla) header .sub{display:none}
.abasBaixo{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0a09;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.abasBaixo button{position:relative;height:var(--abas);background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:600 .7rem system-ui,sans-serif;cursor:pointer;padding:0;touch-action:manipulation}
.abasBaixo button i{display:block;font-style:normal;font-size:1.3rem;line-height:1.25}
.abasBaixo button.ativo{color:var(--gold);border-top-color:var(--gold)}
.abasBaixo button.alerta::after{content:"";position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:#e0483e}
/* o cartão único da aba Jogo (André 2026-11-26): um só, embaixo do mapa, diz o que o herói está fazendo agora */
.cartaoAcao{background:rgba(22,20,16,.95);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.cartaoAcao.luta{border-top-color:#d9362b;background:rgba(40,14,10,.95)}
.cartaoAcao.morto{border-top-color:#777}
.cartaoAcao .tit{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.98rem}
.cartaoAcao .tit span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartaoAcao .tit button{flex:none;min-height:38px}
.cartaoAcao .bts{margin-top:0}
.cartaoAcao .bts button.acao{flex:1 1 40%;min-height:44px}
.cartaoAcao button.volta{background:rgba(95,154,69,.3);border-color:#7fcf7f}
.cartaoAcao .habLeve{margin-top:0}
.cartaoAcao .barraAlvo{height:6px;border-radius:3px;background:#2b2822;overflow:hidden}.cartaoAcao .barraAlvo b{display:block;height:100%;background:#d9362b}
.ico.vazioEq{opacity:.45}
.ico{position:relative}.ico .melhorEq{position:absolute;top:1px;right:3px;font-style:normal;color:#7fdc6a;font-size:.8rem;text-shadow:0 0 3px #000}.ico.gasta{outline:2px solid #f5523d;border-radius:8px}
.heroiLeve{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.heroiLeve div{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}.heroiLeve small{color:var(--muted);min-width:5.5em}.heroiLeve em{color:#7fdc6a;font-style:normal}
.missaoLeve{display:flex;align-items:center;gap:6px;margin-top:5px;padding:4px 6px;border:1px solid rgba(184,158,242,.9);border-radius:10px;background:rgba(15,13,10,.8)}.missaoLeve .tx{flex:1;min-width:0;display:grid}.missaoLeve b{font-size:.72rem;color:#e6dcff;line-height:1.15}.missaoLeve small{font-size:.68rem;color:#d9d1c7;line-height:1.15}.missaoLeve small.pronto{color:#fff2d9}.missaoLeve button{flex:none;min-width:36px;min-height:30px;border-radius:9px;border:1px solid #7a5a2c;background:#3b6a2e;color:#fff;font:800 .8rem system-ui,sans-serif}
#jogarStatus{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lista{display:grid;gap:8px}
.lista button.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .95rem system-ui,sans-serif;padding:0 12px;cursor:pointer;text-align:left}
.lista button.item small{color:var(--muted);font-weight:500;font-size:.78rem;text-align:right}
.lista button.item:disabled{opacity:.45}
main{max-width:640px;margin:0 auto;padding:12px 16px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.linha{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nome{font-weight:700}
.nv{color:var(--gold);font-weight:600;flex:none}
.faz{color:var(--muted);font-size:.86rem;margin-top:2px}
.barras{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.barra{height:6px;border-radius:3px;background:#2b2822;overflow:hidden}
.barra b{display:block;height:100%}
.rot{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.ordem{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
select,button.acao{min-height:40px;border-radius:8px;border:1px solid var(--line);background:#26231d;color:var(--ink);font:500 .9rem system-ui,sans-serif;padding:0 10px;max-width:100%}
select{flex:1 1 130px}
button.acao{background:rgba(217,165,74,.18);border-color:rgba(217,165,74,.55);cursor:pointer;flex:none}
button.acao:disabled{opacity:.5}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.fora{opacity:.7}
.card.cheio{border-color:#d9534a;box-shadow:0 0 0 1px #d9534a inset}
.tag.cheio{color:#fff;background:#b8382f;border-color:#d9534a}
.tag.quase{color:#1a1206;background:#e0a03a;border-color:#f0b850}
.moch{display:flex;align-items:center;gap:6px;margin:4px 0 2px}.moch .tag{margin-left:0}
button.esv{font:500 .72rem system-ui,sans-serif;padding:2px 10px;min-height:24px;border-radius:999px;border:1px solid rgba(217,165,74,.55);background:rgba(217,165,74,.18);color:var(--ink);cursor:pointer}button.esv:disabled{opacity:.5}
.faz.ganho{font-size:.85rem}.faz.ganho.mais{color:#9ad86a}.faz.ganho.menos{color:#e5574a}.moral{display:inline-flex;align-items:center;gap:4px;flex:none;cursor:pointer;font-size:.9rem}.moral img{width:20px;height:20px}.moral .ph{color:var(--muted);margin-right:4px}.moral .seta{width:15px;height:15px}.moral img.fome{width:16px;height:16px;filter:sepia(1) saturate(4) hue-rotate(-20deg)}.moral img.bem{width:16px;height:16px}
nav button.alerta::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0483e;margin-left:6px;vertical-align:2px}
#aviso{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0) + var(--abas) + 12px);max-width:608px;margin:0 auto;background:#2c2418;border:1px solid rgba(217,165,74,.5);border-radius:10px;padding:10px 12px;z-index:5}
#mapa{width:100%;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:#1a3e66;display:block;touch-action:none;cursor:grab}
.mapaCx{position:relative}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:44px;height:44px;border-radius:10px;border:1px solid rgba(239,231,214,.35);background:rgba(16,15,12,.82);color:var(--ink);font:600 1.4rem/1 system-ui,sans-serif;cursor:pointer}
.zoom button:active{background:rgba(217,165,74,.35)}
.icones{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ico.pat{width:64px}.ico.pat small{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ico.pat .apagado{opacity:.7}
.placar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;font-size:26px}.placar img{width:40px;height:40px}.placar .chama{color:#ff9a3c}.placar .geada{color:#8fd0ff}
.ico{width:52px;display:grid;justify-items:center;gap:2px;cursor:pointer}
.ico .q{width:46px;height:46px;border-radius:8px;background:#0b0a09;border:1px solid rgba(224,128,106,.8);display:grid;place-items:center;overflow:hidden}
.ico.ok .q{border-color:rgba(115,199,115,.8)}
.ico img{width:38px;height:38px;object-fit:contain}
.ico .nvb{font:700 .95rem system-ui,sans-serif;color:var(--gold)}
.ico small{font-size:.72rem;color:#e0806a;white-space:nowrap}
.ico.ok small{color:#7fcf7f}
.ico.qtd .q{border-color:rgba(217,165,74,.45)}
.ico.qtd small{color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:36px;border-radius:999px;border:1px solid var(--line);background:#26231d;color:var(--muted);font:600 .82rem system-ui,sans-serif;padding:0 12px;cursor:pointer}
/* modo leve só em pé (André 2026-11-25): deitado no celular ou tablet, pede para girar; tablet em pé usa a largura em 2 colunas */
#jogarAba>.gire{display:none;text-align:center;padding:24px 16px;color:var(--ink)}
@media (orientation:landscape) and (hover:none),(orientation:landscape) and (pointer:coarse),(orientation:landscape) and (max-height:520px){#jogarAba>*{display:none!important}#jogarAba>.gire{display:block!important}}
@media (orientation:portrait) and (min-width:700px){#jogarAba:not(.tela){max-width:980px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}#jogarChat{grid-column:1/-1}}
.sanfona .cab{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--ink);font:700 1rem system-ui,sans-serif;padding:0;cursor:pointer;text-align:left}
.sanfona>button.sec{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;margin-top:6px;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:600 .95rem system-ui,sans-serif;padding:0 2px;cursor:pointer;text-align:left}
.sanfona>button.sec small{color:var(--muted);font-weight:500}
.sanfona .linha{display:flex;justify-content:space-between;gap:8px;width:100%;min-height:32px;background:#26231d;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:500 .84rem system-ui,sans-serif;padding:4px 10px;margin:3px 0;cursor:pointer;text-align:left}
.sanfona .linha span:last-child{color:var(--muted);flex:none}
.chips button.ativo{color:var(--ink);border-color:var(--gold);background:rgba(217,165,74,.18)}
.ico.preco small{color:var(--gold)}
input.busca{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#0b0a09;color:var(--ink);font:500 1rem system-ui,sans-serif;padding:0 12px;margin-bottom:8px}
input.busca:focus{outline:none;border-color:var(--gold)}
.ico .q{position:relative}
.ico .q b{position:absolute;right:2px;bottom:0;font:700 .66rem system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted)}
.legenda span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.log div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.log small{color:var(--muted);margin-right:6px}
#entrar{display:grid;gap:14px;justify-items:center;text-align:center;padding:40px 16px}
#entrar p{color:var(--muted);margin:0;max-width:420px}
.vazio{color:var(--muted);text-align:center;padding:20px 0}
.opc{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
/* Jogar: o modo leve (André 2026-11-25) */
/* tela do modo leve (André 2026-11-25: "tem q rolar muito"): mapa na tela toda, status em cima, barra embaixo, painéis por cima do mapa */
body.leveTela #aviso{top:40%;font-size:.9rem;padding:6px 12px;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:min(86vw,420px);text-align:center;background:rgba(44,36,24,.9);pointer-events:none;z-index:6}
#jogarAba.tela{display:block;position:relative;max-width:980px;padding:4px 8px 8px;overflow:hidden}
#jogarAba.tela>#jogarMapa{position:absolute;inset:4px 8px 8px}
#jogarAba.tela .mapaCx{height:100%}
#jogarAba.tela #mapa{height:100%;aspect-ratio:auto}
#jogarAba.tela>#jogar{position:absolute;inset:4px 8px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;pointer-events:none}
#jogarAba.tela>#jogar>*{pointer-events:auto}
#jogarAba.tela .hud{align-self:flex-start;width:calc(100% - 64px);max-width:440px;margin:6px 0 0 6px;padding:8px 10px;background:rgba(22,20,16,.86);backdrop-filter:blur(2px);color:var(--ink)}
#jogarAba.tela .hud .faz,#jogarAba.tela .hud .nome{font-size:.8rem;margin:2px 0}
.bts.mini{margin-top:4px;gap:5px}
.coletaLeve{margin-top:6px;padding:8px 10px;border:1px solid rgba(217,165,74,.6);border-radius:10px;background:rgba(217,165,74,.12)}
.coletaLeve .titulo{font-weight:700;font-size:1rem}
.progColeta{height:8px;margin:6px 0 4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.progColeta i{display:block;height:100%;width:0;background:#d9a54a;transition:width .5s linear}
.progColeta.vai i{width:35%;animation:vaiColeta 1.2s linear infinite}
@keyframes vaiColeta{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.bts.mini button.acao{flex:1 1 auto;min-height:32px;padding:0 8px;font-size:.78rem}
#jogarAba.tela .folha{margin-top:auto;max-height:58%;overflow-y:auto;overscroll-behavior:contain;background:rgba(22,20,16,.95);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:8px}
#jogarAba.tela .folha .card{background:transparent;border:0;padding:2px}
.folhaCab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:rgba(22,20,16,.98);margin:-8px -8px 0;padding:6px 8px;border-bottom:1px solid var(--line);z-index:1}
.folhaCab .fecha{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#26231d;color:var(--ink);font-size:1rem;cursor:pointer}
.doca{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(16,15,12,.9);border:1px solid var(--line);border-radius:12px;padding:6px}
.doca button{position:relative;min-height:44px;border-radius:9px;border:1px solid var(--line);background:#26231d;color:var(--ink);font:600 .86rem system-ui,sans-serif;cursor:pointer}
.doca button.ativo{border-color:var(--gold);background:rgba(217,165,74,.22)}
.doca button.tem::after{content:"";position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#73c773}
#jogarAba.tela>#jogarChat{position:absolute;left:8px;right:8px;bottom:70px;max-height:58%;overflow:auto;background:rgba(22,20,16,.95);z-index:1}
#jogarAba.tela .gire{position:absolute;inset:0;z-index:3}

#jogarExtra{display:grid;gap:8px}
#jogar{display:grid;gap:10px}
#jogarAba>*,#jogar>*{min-width:0}
.bfLeve{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}.bfLeve small{font-size:.62rem;color:var(--muted)}
.bfLeve .bf{position:relative;width:24px;height:24px;border-radius:50%;border:0;padding:2px;cursor:pointer}

.bfLeve .bf img{width:16px;height:16px;object-fit:contain}.bfLeve .bf>b{position:absolute;right:-3px;bottom:-3px;font-size:9px;background:#000c;color:#fff;border-radius:6px;padding:0 3px}
.vm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.75rem;color:var(--muted)}
.vm .barra{flex:1}
.vm>div{min-width:92px}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bts button.acao{flex:1 1 30%}
button.acao.cinza{background:#26231d;border-color:var(--line)}
.ico.sel .q{box-shadow:0 0 0 2px var(--gold) inset;border-color:var(--gold)}
.qtd-linha{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

/* jogo leve mais simples (André 2026-11-25: "mais intuitivo e fluido... um celular no trabalho"): botões redondos à direita, barra com ícones, Ir para com atalhos, janelinha de quantidade, dica da 1ª vez */
