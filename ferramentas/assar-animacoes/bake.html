<!doctype html><html><body>
<script src="node_modules/three/build/three.min.js"></script>
<script src="node_modules/three/examples/js/libs/fflate.min.js"></script>
<script src="node_modules/three/examples/js/loaders/FBXLoader.js"></script>
<script>
window.bake=async function(files){
  const out={};const L=new THREE.FBXLoader();
  for(const f of files){
    const buf=await (await fetch('fbx/'+f+'.fbx')).arrayBuffer();
    const g=L.parse(buf,'');const c=g.animations[0];
    const tr=[];
    for(const t of c.tracks){
      const isQ=/\.quaternion$/.test(t.name), isHipP=/Hips\.position$/.test(t.name);
      if(!isQ&&!isHipP)continue;
      // reduz para 30 fps
      const times=[],vals=[];const n=t.getValueSize();let last=-1;
      for(let i=0;i<t.times.length;i++){const tm=t.times[i];if(last>=0&&tm-last<1/30-1e-4&&i<t.times.length-1)continue;last=tm;
        times.push(Math.round(tm*1000)/1000);for(let k=0;k<n;k++){const v=t.values[i*n+k];vals.push(isQ?Math.round(v*1e4)/1e4:Math.round(v*100)/100)}}
      // trilha constante vira 1 chave
      let constant=true;for(let i=n;i<vals.length&&constant;i++)if(Math.abs(vals[i]-vals[i%n])>2e-4)constant=false;
      tr.push(constant?[t.name,[0],vals.slice(0,n)]:[t.name,times,vals]);
    }
    out[f]={d:Math.round(c.duration*1000)/1000,t:tr};
  }
  // pose de descanso do esqueleto do Mixamo: necessária para passar as animações para o VRM
  const g=L.parse(await (await fetch('fbx/'+files[0]+'.fbx')).arrayBuffer(),'');g.updateMatrixWorld(true);
  const rest={};const q=new THREE.Quaternion();
  g.traverse(o=>{if(!o.isBone)return;const inv=o.getWorldQuaternion(new THREE.Quaternion()).invert();const pw=o.parent.getWorldQuaternion(new THREE.Quaternion());
    rest[o.name]=[...inv.toArray().map(v=>Math.round(v*1e5)/1e5),...pw.toArray().map(v=>Math.round(v*1e5)/1e5)]});
  const hips=g.getObjectByName('mixamorigHips');
  out._rest={ossos:rest,alturaQuadril:Math.round(hips.position.y*100)/100};
  return out;
};
</script></body></html>
