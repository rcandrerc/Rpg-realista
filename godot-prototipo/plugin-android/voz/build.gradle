plugins { id 'com.android.library' }
android {
    namespace 'com.rcandrerc.voz'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    compileOnly 'org.godotengine:godot:4.5.0.stable'
    // escuta contínua (VozVosk): no APK entra pelo plugin.gd (_get_android_dependencies)
    compileOnly 'com.alphacephei:vosk-android:0.3.75@aar'
    compileOnly 'net.java.dev.jna:jna:5.18.1@aar'
}
